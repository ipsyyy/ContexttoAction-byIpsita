<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Context to Action by Ipsita · Listening</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="chief.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* Stage anchors to bottom-right; cards grow upward */
  #stage {
    position: fixed;
    right: 4px;
    bottom: 4px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  #whisper-card, #action-card { display: none; }


  .cf-card-entering {
    animation: cf-card-enter var(--dur-base) var(--ease-enter) both;
  }
  @keyframes cf-card-enter {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Status cluster */
  #status-wrap {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px 6px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.07);
    transition: opacity 180ms;
  }
  #status-wrap.hidden { opacity: 0; pointer-events: none; }

  #status-label {
    font: 500 11px/1 var(--font-ui);
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* ── Framer-style glowing orb ── */
  .framer-orb-container {
    position: relative;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-app-region: no-drag;
    overflow: visible;
  }

  .framer-orb-core {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4caf85;
    box-shadow: inset -1px -1px 3px rgba(0,0,0,0.12), inset 1px 1px 3px rgba(255,255,255,0.6);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.4s ease;
    z-index: 2;
  }

  .framer-orb-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 22px; height: 22px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: inherit;
    filter: blur(7px);
    opacity: 0.15;
    z-index: 1;
    transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.4s ease;
  }

  @keyframes orb-whisper-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.15; }
    50%       { transform: translate(-50%, -50%) scale(1.3); opacity: 0.25; }
  }
  .is-whispering .framer-orb-glow {
    animation: orb-whisper-pulse 1.8s ease-in-out infinite;
  }

  /* Idle breathing — gentle "vital sign" when nothing else is happening.
     pulse() adds the `.is-pulsing` class on the core during speech-driven
     scaling and removes it when audio drops below threshold. CSS owns the
     resting animation; JS owns the responsive one. */
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1.00); }
    50%       { transform: scale(1.06); }
  }
  .framer-orb-container:not(.is-whispering) .framer-orb-core:not(.is-pulsing) {
    animation: orb-breathe 2.4s ease-in-out infinite;
  }

  /* Halo flash — one-shot ring on whisper fire. Cues the eye to the orb
     before the card renders. */
  @keyframes orb-halo-flash {
    0%   { transform: translate(-50%, -50%) scale(1);    opacity: 0.55; }
    100% { transform: translate(-50%, -50%) scale(3.2);  opacity: 0; }
  }
  .framer-orb-halo {
    position: absolute;
    top: 50%; left: 50%;
    width: 22px; height: 22px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  .framer-orb-halo.flash {
    color: #d99366;
    animation: orb-halo-flash 520ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* Whisper text word-stagger. Each word starts hidden and fades in
     via animation-delay set on the span. */
  @keyframes whisper-word-in {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .cf-whisper-payload .w {
    display: inline-block;
    opacity: 0;
    animation: whisper-word-in 200ms ease-out forwards;
    white-space: pre;
  }

  /* Provenance line — dim mono caption under the whisper. Visible only
     when the wire payload includes provenance metadata. */
  .cf-whisper-provenance {
    margin-top: 6px;
    font: 500 10px/1.25 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    color: var(--muted, rgba(0,0,0,0.42));
    letter-spacing: 0.02em;
    opacity: 0;
    animation: whisper-word-in 220ms ease-out forwards;
    animation-delay: 360ms;
  }
  .cf-whisper-provenance.hidden { display: none; }
  .cf-whisper-provenance::before { content: "↳ "; opacity: 0.55; }
</style>
</head>
<body>
<div id="stage">

  <!-- Whisper card -->
  <div id="whisper-card" class="cf-whisper">
    <div class="cf-whisper-body">
      <div class="cf-whisper-eyebrow" id="whisper-eyebrow">Context to Action by Ipsita</div>
      <div class="cf-whisper-payload" id="whisper-payload"></div>
      <div class="cf-whisper-provenance hidden" id="whisper-provenance"></div>
    </div>
  </div>

  <!-- Action card -->
  <div id="action-card" class="cf-action">
    <div class="cf-action-head">
      <span class="cf-action-kind" id="action-kind-label"></span>
      <span class="cf-action-time">ready</span>
    </div>
    <div class="cf-action-title" id="action-title"></div>
    <div class="cf-action-summary" id="action-summary"></div>
    <div class="cf-action-preview" id="action-preview"></div>
    <div class="cf-action-foot" id="action-foot"></div>
  </div>

  <!-- Status ring + label -->
  <div id="status-wrap">
    <div id="ring-container" class="framer-orb-container" style="width:22px;height:22px">
      <div class="framer-orb-halo" id="framer-orb-halo"></div>
      <div class="framer-orb-core" id="framer-orb-core">
        <div class="framer-orb-glow" id="framer-orb-glow"></div>
      </div>
    </div>
    <span id="status-label">init</span>
  </div>

</div>
<script src="orb.js"></script>
</body>
</html>
